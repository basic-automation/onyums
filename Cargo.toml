[workspace]
resolver = "2"
members = ["crates/onyums-skin"]

# Centralized, shared dependency versions for the onyums workspace.
# Members opt in with `<dep> = { workspace = true }`.
[workspace.dependencies]
# 1.0.103 is a security floor, not a routine bump: 1.0.102 is affected by
# RUSTSEC-2026-0190 — `Error::context` followed by `Error::downcast_mut` violates
# borrow rules and is undefined behaviour. onyums threads `anyhow::Error` through
# every fallible path (`setup_tor_client`, `launch_onion_service`, the builder), so
# this is squarely in the tree. Enforced by `cargo deny check advisories` in CI.
anyhow = "1.0.103"
hyper = { version = "1.10.1", features = ["full"] }
hyper-util = { version = "0.1.20", features = ["full"] }
futures = "0.3.32"
# The embedded Tor client, on arti's `rustls` TLS runtime rather than `native-tls`
# (ROADMAP Phase 2, "100% Rust" — landed 2026-09-23). This is what removes `openssl-sys`
# from the tree and retires the discontinued-`async-std` advisory: both rode in on the
# `full` umbrellas, and cargo features are additive, so `full` cannot be kept and
# subtracted from — every direct dependency that reached `tor-rtcompat/full` (which is
# what turns `native-tls` + `async-std` on) is hand-picked instead. The lists below are
# `full`'s own contents minus `native-tls`, `async-std`, and the sub-crate `full`
# umbrellas that chain back to them; they were derived by diffing `cargo tree -e features`
# before and after, not from memory. Notes on the individual entries:
#   - `rustls` is `__is_nonadditive` but NOT `__is_experimental`, so this takes no
#     experimental-feature decision (unlike `hs-pow-full` / `metrics`).
#   - `static-sqlite` replaces the old `static`: arti-client's `static` is
#     `static-sqlite` + `tor-rtcompat/static`, and tor-rtcompat's `static` is
#     `native-tls-crate?/vendored` and nothing else — a no-op under rustls that would
#     have looked right and meant less. The bundled-sqlite half is what onyums wants.
#   - `flowctl-cc` / `counter-galois-onion` are NOT listed: arti 0.46 (Arti 2.6.0)
#     removed those features because the code is always-on now.
#   - tor-rtcompat's `rustls` takes `rustls` with `default-features = false` and picks no
#     crypto provider; the provider comes from feature unification with onyums' own
#     `tokio-rustls = { features = ["ring"] }` below — pure Rust, and the only provider
#     in the graph (deny.toml bans `aws-lc-sys`, the C one, outright).
#   - `tor-rtcompat`'s `full` also carried `arbitrary` (fuzzing) and `tls-server`
#     (relay-side TLS via tor-cert-x509); neither is on a client/onion-service path.
#   - `default-features = false` on arti-client is load-bearing: its `default` is
#     `["tokio", "native-tls", "compression"]`, so with defaults on, `native-tls` comes
#     straight back no matter what the explicit list says (found by diffing the enabled
#     feature sets, exactly the trap the additive model sets). `tokio` and `compression`
#     are re-listed explicitly.
arti-client = { version = "0.46.0", default-features = false, features = ["anyhow", "bridge-client", "compression", "keymgr", "memquota", "onion-service-client", "onion-service-service", "pt-client", "rpc", "static-sqlite", "tokio", "vanguards", "rustls"] }
#   - `tor-cell` is the FIFTH umbrella, which the ROADMAP's four-manifest estimate
#     missed: `tor-cell/full` -> `tor-memquota/full` -> `tor-async-utils/full` ->
#     `tor-rtcompat/full`, found with `cargo tree -e features -i tor-rtcompat
#     --no-dedupe`. onyums itself uses only base relay-cell types (`Begin`/`End`/
#     `Connected`); the onion-service cell feature (`hs`, which tor-cell tags
#     `__is_experimental`) is enabled by tor-hsservice/tor-proto on their own
#     dependency edges, so onyums does not name it — nor `relay`, the relay side.
tor-cell = "0.46.0"
tor-hsservice = { version = "0.46.0", features = ["restricted-discovery"] }
tor-proto = { version = "0.46.0", features = ["tokio", "stream-ctrl", "hs-client", "hs-service", "send-control-msg", "pt-client", "rpc"] }
tor-rtcompat = { version = "0.46.0", features = ["tokio", "rustls"] }
tor-cert = "0.46.0"
# Low-level arti crypto + onion-service identity types. Used by the Phase 1
# vanity-address miner to derive the *exact* `.onion` address arti will serve
# from a candidate ed25519 key (no second, divergent encoding). Pure Rust.
tor-llcrypto = "0.46.0"
tor-hscrypto = "0.46.0"
# Phase 1 identity — pure-Rust QR encoding for the `.onion` address (terminal +
# SVG renderers). `default-features = false` drops the `image` renderer (and its
# heavy `image`/`png` tree); only the always-available unicode renderer and the
# pure-string `svg` renderer are kept. No FFI.
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
tokio = { version = "1.52.3", features = ["full"] }
tokio-util = { version = "0.7.13", default-features = false }
axum = { version = "0.8.9", features = ["http2"] }
tower-service = "0.3.3"
tower-layer = "0.3.3"
tracing = "0.1.44"
# `default-features = false` drops rcgen's `crypto` backend — and with it `ring`, the
# last C library in the tree. rcgen's cert-building machinery does not need it: the
# `SigningKey`/`PublicKeyData` traits are NOT behind the `crypto` feature, so onyums
# supplies its own pure-Rust P-256 signer (see `tls_setup::P256SigningKey`). `pem` is
# kept for `Certificate::pem`.
rcgen = { version = "0.14.10", default-features = false, features = ["pem"] }
# The pure-Rust P-256 signer behind that: key generation, PKCS#8 export for rustls, and
# ASN.1 ECDSA signatures for X.509. RustCrypto, no C and no build script.
# `default-features = false` drops `precomputed-tables`, a size/speed trade onyums does
# not need for one keygen per launch. `pem` is kept: it is what lets the crate's test
# helper emit a PKCS#8 PEM (via the pure-Rust `pem-rfc7468`) instead of hand-rolling
# base64 armouring around key material.
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "pkcs8", "pem", "std"] }
# Phase 2 — scrub x25519 client-auth secret key material on drop. Pure Rust, no FFI
# (MIT/Apache); already in the tree transitively via the dalek/arti crypto stack, so
# adding it direct introduces no new version.
zeroize = "1.8"
# Phase 2 raw-port controls — constant-time byte comparison for the pre-shared-key
# preamble authorizer (`SharedSecretAuth`), so a wrong token cannot be recovered from
# how far the compare got. Pure Rust, no FFI (BSD-3-Clause); already in the tree
# transitively via the dalek/arti crypto stack, so adding it direct introduces no new
# version.
subtle = "2.6"
tokio-rustls = { version = "0.26.4", default-features = false, features = ["logging", "tls12"] }
# Pure-Rust rustls CryptoProvider (graviola, by rustls' own author). Replaces `ring`.
rustls-graviola = "0.4.0"
http-body-util = "0.1.3"
bytes = "1.12.0"
safelog = "0.9.0"
tracing-subscriber = "0.3.23"
# Dev-only: request-level tests of the served Router without a live Tor network.
tower = { version = "0.5.2", features = ["util"] }
# onyums-skin: the abuse-defense layer, consumed by the server for Skin integration.
# The `version` is not redundant with `path`: crates.io rejects a path-only dependency,
# so a path-only entry here would make `cargo publish` of onyums fail (ROADMAP
# cross-cutting — "Sync crates.io with GitHub"). With both, local builds resolve
# through the path and a published onyums depends on onyums-skin 0.1.x from the
# registry. Enforced by `cargo deny check bans` (wildcard dependency).
onyums-skin = { path = "crates/onyums-skin", version = "0.1.0" }
# onyums-skin gate-core deps — pure Rust, no FFI (MIT/Apache).
sha2 = "0.10.9"
# 0.10 is not a routine bump: it is what takes `rand` 0.9 *out of the tree*. arti (0.44
# onward) is on `rand` 0.10, and onyums + onyums-skin were the last two reverse deps on 0.9
# (governor's edge went with its `jitter` feature — see the `governor` entry below), so
# moving both crates here aligns the workspace with the arti stack and drops a genuine
# duplicate. The API delta is one rename at our usage level: `rand_core`'s `RngCore` is
# now `Rng` (and the old extension trait `Rng` is now `RngExt`, which this workspace
# does not use — `rand::rng()`, `fill_bytes`, and `rand::random::<u64>()` are unchanged).
rand = "0.10.2"
hmac = "0.12.1"
base64 = "0.22.1"
# `default-features = false` drops governor's `jitter` feature, which skin does not use
# (`ratelimit.rs` takes `DefaultKeyedRateLimiter` + `Quota` and no `Jitter`). Jitter is the
# *only* thing pulling `rand`/`getrandom` into governor's subtree — its `rand` dep is
# optional — so turning it off removes one of the three reverse deps on `rand` 0.9 and
# drops `getrandom`'s `wasm_js`, which is dead weight on a server. The other three default
# features are kept **deliberately**: `quanta` because it selects governor's `DefaultClock`
# (dropping it silently swaps the limiter's clock for `MonotonicClock`), `dashmap` because
# `DefaultKeyedRateLimiter`'s state store is a `DashMap`, and `std` for the rest.
# This does not by itself remove `rand` 0.9 from the tree — onyums and onyums-skin still
# depend on it directly; see the ROADMAP's dependency-tree item.
governor = { version = "0.10.1", default-features = false, features = ["std", "dashmap", "quanta"] }
# onyums-skin WAF (Phase 3) — pure Rust signature matching. `regex` pulls in
# `aho-corasick` internally for literal prefiltering (both MIT/Apache, no FFI).
regex = "1.11.1"
# onyums-skin Phase 5 optional PoW backend — Tor's own Equi-X puzzle, pure Rust.
# LGPL-3.0, so it is gated behind onyums-skin's opt-in `equix` cargo feature to keep
# the default build copyleft-free. `default-features = false` selects HashX's portable
# interpreter (no runtime code generation / executable pages); the optional pure-Rust
# JIT is reachable via the `equix/compiler` feature. No FFI in any configuration.
equix = { version = "0.6.2", default-features = false }

[package]
name = "onyums"
# 0.5.0, not 0.4.1: the crypto stack went pure Rust (`rustls-graviola` + `p256`, no C
# compiled at all), and `graviola` builds on **x86_64 and aarch64 only** — a compile
# error anywhere else. onyums 0.4.x built wherever `ring` did, so this narrows the
# supported platforms, which is breaking under 0.x semver however welcome the change is
# otherwise. Pin 0.4.x for armv7/riscv64/32-bit targets. Nothing in the public API
# signature changed: `OnionTorClient` is still `TorClient<TokioRustlsRuntime>`.
#
# (0.4.0 was the previous bump: MSRV 1.85 -> 1.91 with the arti stack, and
# `OnionTorClient` moving from `TokioNativeTlsRuntime` to `TokioRustlsRuntime`.)
version = "0.5.0"
edition = "2024"
# Minimum supported Rust version. Not a guess: 1.91 is the floor cargo's own
# resolver enforces — every `tor-*`/`arti-client` 0.46.0 crate declares
# `rust-version = 1.91` (as 0.44.0 did; the 0.43 -> 0.44 bump is what moved it from
# 1.90, and 0.44 -> 0.46 left it alone — the highest `rust_version` in the whole
# resolved graph is still 1.91, checked with `cargo metadata` on the 0.46 lock).
# Edition 2024 alone would only need 1.85 — the arti stack, not the edition, sets
# this floor. Enforced in CI.
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/basic-automation/onyums"
readme = "README.md"
description = "An Onion-service server using axum."
keywords = ["tor", "onion-service", "axum", "server", "arti"]
categories = ["network-programming", "web-programming::http-server"]

[dependencies]
anyhow = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
futures = { workspace = true }
arti-client = { workspace = true }
tor-cell = { workspace = true }
tor-hsservice = { workspace = true }
tor-proto = { workspace = true }
tor-rtcompat = { workspace = true }
tor-cert = { workspace = true }
tor-llcrypto = { workspace = true }
tor-hscrypto = { workspace = true }
qrcode = { workspace = true }
rand = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
onyums-skin = { workspace = true }
axum = { workspace = true }
tower-service = { workspace = true }
tracing = { workspace = true }
rcgen = { workspace = true }
p256 = { workspace = true }
zeroize = { workspace = true }
subtle = { workspace = true }
tokio-rustls = { workspace = true }
rustls-graviola = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
safelog = { workspace = true }

[dev-dependencies]
# `test-util` (not part of tokio's `full`) gives the tests tokio's *paused clock*, so the
# per-handler-timeout tests assert on a 30s timeout firing without spending 30s of real
# wall time — and without the flakiness a short real timeout would bring.
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true }
tower = { workspace = true }
